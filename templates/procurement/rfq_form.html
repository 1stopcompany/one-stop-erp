{% extends 'base.html' %}{% block title %}New RFQ{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center my-4">
  <h1 class="h3 mb-0">New RFQ &mdash; {{ pr.pr_number }}</h1>
  <a href="{% url 'procurement:pr_detail' pr.pk %}" class="btn btn-outline-secondary">Back</a>
</div>
<div class="card"><div class="card-body">
  <form method="post" novalidate>
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Invite Vendors</label>
      {{ form.vendors }}
      {% for e in form.vendors.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
    <div class="row">
      <div class="col-md-4 mb-3"><label class="form-label">Due Date</label>{{ form.due_date }}</div>
      <div class="col-md-8 mb-3"><label class="form-label">Notes</label>{{ form.notes }}</div>
    </div>
    <button type="submit" class="btn btn-primary">Create RFQ</button>
    <a href="{% url 'procurement:pr_detail' pr.pk %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div></div>
{% endblock %}
