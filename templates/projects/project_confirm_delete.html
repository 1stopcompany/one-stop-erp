{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Delete Project</h2>
    <hr>
    
    <div class="alert alert-danger">
        <p>Are you sure you want to delete the project: <strong>"{{ object.name }}"</strong>?</p>
        <p><small>This action cannot be undone.</small></p>
    </div>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirm Delete</button>
        
        <a href="{% url 'projects:project_detail' object.pk %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
