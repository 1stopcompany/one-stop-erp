{% extends 'base.html' %}
{% block title %}Add Floor - One Stop ERP{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center my-4"><div><h1 class="h3 mb-1">Add Project Floor</h1><p class="text-muted mb-0">{{ project.name }}</p></div><a class="btn btn-outline-secondary" href="{% url 'projects:project_floors' project.pk %}">Back</a></div>
<div class="card"><div class="card-body"><form method="post" novalidate>{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">Save Floor</button></form></div></div>
{% endblock %}
